name: Scheduled Squash and Merge

on:
  schedule:
    - cron: '0 8 * * *' 
  workflow_dispatch: 

# THIS IS THE FIX: Explicitly grant write access
permissions:
  contents: write
  pull-requests: write

jobs:
  scheduled-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Squash and Merge PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Fetching PRs with 'scheduled-merge' label ==="
          
          # Using 'gh' is safer than curl for handling permissions and formatting
          PR_LIST=$(gh pr list --label "scheduled-merge" --state open --json number --jq '.[].number')

          if [ -z "$PR_LIST" ]; then
            echo "No open PRs found with the 'scheduled-merge' label."
            exit 0
          fi

          for PR_NUMBER in $PR_LIST; do
            echo "Processing PR #$PR_NUMBER..."
            
            # Check if it's a draft
            IS_DRAFT=$(gh pr view $PR_NUMBER --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Skipping PR #$PR_NUMBER (Draft)."
              continue
            fi

            echo "Merging PR #$PR_NUMBER..."
            # --admin bypasses branch protections (requires 'write' permission)
            # --squash performs the squash
            # --delete-branch cleans up the feature branch
            if gh pr merge $PR_NUMBER --squash --delete-branch --admin; then
              echo "✅ Successfully merged PR #$PR_NUMBER"
            else
              echo "❌ Failed to merge PR #$PR_NUMBER. Check for conflicts or CI failures."
            fi
          done