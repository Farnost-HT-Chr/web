name: Scheduled Squash and Merge

on:
  # This triggers the script (e.g., every day at 08:00 UTC)
  schedule:
    - cron: '0 8 * * *' 
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  scheduled-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Squash and Merge PRs with 'scheduled-merge' label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Debug: Show current repository and branch info  
          echo "=== Repository Info ==="
          echo "Repository: ${{ github.repository }}"
          echo "Current branch: ${{ github.ref }}"
          echo "Default branch: ${{ github.event.repository.default_branch }}"
          
          # 2. Debug: List ALL PRs using simple format (no GraphQL)
          echo "=== All Open PRs ==="
          gh pr list --state open || echo "No open PRs found"
          
          echo "=== All Closed PRs ==="  
          gh pr list --state closed || echo "No closed PRs found"
          
          echo "=== All Merged PRs ==="
          gh pr list --state merged || echo "No merged PRs found"
          
          # 3. Debug: List all repository labels using REST API
          echo "=== All available labels ==="
          curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/labels" | \
            jq -r '.[] | .name' 2>/dev/null || echo "Could not fetch labels"
          
          # 4. Simple search for PRs with scheduled-merge label
          echo "=== Searching for PRs with 'scheduled-merge' label ==="
          
          # Use REST API to find PRs with the label
          RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pulls?state=open")
          
          if [ $? -ne 0 ]; then
            echo "Failed to fetch PRs via REST API"
            exit 1
          fi  
          
          # Parse the response to find PRs with our label
          PR_NUMBERS=$(echo "$RESPONSE" | jq -r '.[] | select(.labels[]?.name == "scheduled-merge") | select(.draft == false) | .number' 2>/dev/null)
          
          if [ -z "$PR_NUMBERS" ]; then
            echo "No ready PRs found with the 'scheduled-merge' label."
            
            # Check for draft PRs with this label
            DRAFT_PR_NUMBERS=$(echo "$RESPONSE" | jq -r '.[] | select(.labels[]?.name == "scheduled-merge") | select(.draft == true) | .number' 2>/dev/null)
            if [ ! -z "$DRAFT_PR_NUMBERS" ]; then
              echo "Found draft PRs with 'scheduled-merge' label: $DRAFT_PR_NUMBERS"
            fi
            
            # Also check closed PRs
            echo "=== Checking closed PRs ==="
            CLOSED_RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/pulls?state=closed")
            CLOSED_PR_NUMBERS=$(echo "$CLOSED_RESPONSE" | jq -r '.[] | select(.labels[]?.name == "scheduled-merge") | .number' 2>/dev/null)
            if [ ! -z "$CLOSED_PR_NUMBERS" ]; then
              echo "Found closed PRs with 'scheduled-merge' label: $CLOSED_PR_NUMBERS"
            fi
            
            exit 0
          fi

          echo "Found PRs to merge: $PR_NUMBERS"

          # 5. Process each PR
          for PR_NUMBER in $PR_NUMBERS; do            
            echo "Processing PR #$PR_NUMBER..."
            
            # Get PR details
            PR_DETAILS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER")
            
            BASE_BRANCH=$(echo "$PR_DETAILS" | jq -r '.base.ref')
            MERGEABLE=$(echo "$PR_DETAILS" | jq -r '.mergeable')
            
            echo "PR #$PR_NUMBER targets branch: $BASE_BRANCH"
            echo "PR #$PR_NUMBER mergeable status: $MERGEABLE"
            
            if [ "$MERGEABLE" != "true" ]; then
              echo "PR #$PR_NUMBER is not mergeable. Skipping."
              continue
            fi
            
            echo "Attempting to merge PR #$PR_NUMBER..."
            if gh pr merge $PR_NUMBER --squash --auto --delete-branch; then
              echo "✅ Successfully merged PR #$PR_NUMBER"
            else
              echo "❌ Failed to merge PR #$PR_NUMBER"
            fi
          done